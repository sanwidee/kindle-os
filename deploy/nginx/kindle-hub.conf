# kindle-os hub -- nginx vhost
#
# Target: AlmaLinux 8.10, nginx 1.14.1 (VERIFIED on the box), OpenSSL 1.1.1k.
# This file uses the 1.14.1 dialect deliberately: `listen 443 ssl http2;` and
# NOT the `http2 on;` form, which only exists from nginx 1.25.
#
# WHY THIS FILE EXISTS AT ALL
# ---------------------------
# The security review found that the design's central access control -- the
# `internal` directive on the EPUB location -- was described in hub/README.md
# and never written. Without it, every generated EPUB was fetchable with no
# credentials at a guessable URL, and NOTHING detected the gap: the app tests
# passed, `kindle_hub doctor` printed "x-accel True", /admin/health reported
# "xaccel": true, the Kindle worked, and the browser worked. Every observable
# signal said healthy while the store was open to the internet.
#
# So: this file is part of the application, not part of "ops". Changing it
# changes who can read San's private notes. Read deploy/verify.sh before you
# edit it, and run that script after.

# Rate limit zones. fail2ban on this box jails sshd ONLY (verified), so there
# is no HTTP brute-force protection anywhere else. These zones are doing real
# work, not defence in depth.
#
# The app also bounds concurrent argon2 verifies internally now, so a failure
# to load this file is no longer an instant OOM. Both layers, on purpose.
limit_req_zone $binary_remote_addr zone=kindlehub_login:1m rate=12r/m;
limit_req_zone $binary_remote_addr zone=kindlehub_all:1m   rate=120r/m;

server {
    listen      80;
    listen      [::]:80;
    server_name kindle.weedlabs.online;

    # ACME. The existing 00-acme.conf on this box is scoped to
    # `server_name app.weedlabs.online` only, so a new subdomain needs its own
    # webroot block -- it does not inherit one.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name kindle.weedlabs.online;

    ssl_certificate     /etc/letsencrypt/live/kindle.weedlabs.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kindle.weedlabs.online/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:kindlehub_ssl:1m;
    ssl_session_timeout       1h;

    # NO HSTS PRELOAD, and no `includeSubDomains`.
    #
    # weedlabs.online carries other hosts on a different box entirely; a
    # subdomain-wide policy set from here would be a decision made in the
    # wrong place. Plain max-age only.
    #
    # Note honestly what this does and does not buy: KOReader sets LuaSec
    # `verify = "none"` and ships no CA bundle, so the Kindle does not
    # validate our certificate and HSTS means nothing to it. This header
    # protects the BROWSER door. The Kindle door's exposure to an active MITM
    # is accepted, documented, and compensated by the per-token access log --
    # it is not fixed here, and no nginx directive can fix it.
    add_header Strict-Transport-Security "max-age=15768000" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "same-origin" always;

    # Large enough for a chapter-sized CBZ later; small enough that nobody
    # uses this host as a dump target.
    client_max_body_size 64m;

    access_log /var/log/nginx/kindle-hub.access.log;
    error_log  /var/log/nginx/kindle-hub.error.log warn;

    # --- the control that must not be missing -----------------------------
    #
    # The app never streams EPUB bytes itself. It authenticates the request,
    # then returns X-Accel-Redirect pointing into this prefix, and nginx does
    # the sending. `internal` is what makes that safe: nginx refuses any
    # request for this prefix that arrives from outside.
    #
    # DO NOT remove `internal`.
    # DO NOT drop the trailing slash on either the location or the alias.
    # deploy/verify.sh asserts an external GET here returns 404, and that
    # assertion is the only thing standing between a config typo and a silent
    # full-library leak.
    location /_epub/ {
        internal;
        alias /srv/kindle-os/library/;

        # These files are immutable: the filename carries a content hash.
        add_header Cache-Control "private, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Same contract as /_epub/, for the personal library shelf. The app
    # authenticates, then hands off with X-Accel-Redirect; `internal` is what
    # stops anyone fetching a book straight off the filesystem.
    #
    # DO NOT remove `internal`. deploy/verify.sh probes this from outside.
    location /_ebooks/ {
        internal;
        alias /srv/kindle-os/ebooks/;

        # Books are large; let nginx stream rather than buffer, and give a
        # slow Kindle on hotel wifi time to finish a 150 MB reference volume.
        sendfile on;
        tcp_nopush on;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- login: the one unauthenticated, expensive endpoint ---------------
    location = /login {
        limit_req      zone=kindlehub_login burst=4 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8090;
        include    /etc/nginx/conf.d/kindle-hub-proxy.inc;
    }

    # Never serve a dotfile, whatever else is misconfigured.
    location ~ /\. {
        deny all;
        return 404;
    }

    location / {
        limit_req      zone=kindlehub_all burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8090;
        include    /etc/nginx/conf.d/kindle-hub-proxy.inc;

        # KOReader downloads on the UI thread and its socket timeouts are
        # generous; do not let nginx cut a large acquisition short.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_buffering       off;
    }
}
