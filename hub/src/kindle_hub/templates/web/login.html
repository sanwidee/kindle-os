<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Sign in · {{ site_title }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='reader.css') }}">
</head>
<body>
<div class="login">
  <h1>{{ site_title }}</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('reader.login_post') }}">
    <input type="hidden" name="csrf" value="{{ g.csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="password" style="display:block;font-size:0.85rem;margin-bottom:0.4rem">Password</label>
    <input id="password" type="password" name="password" autocomplete="current-password"
           autofocus required>
    <button type="submit">Sign in</button>
  </form>
</div>
</body>
</html>
