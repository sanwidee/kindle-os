<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>{% block title %}{{ site_title }}{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='reader.css') }}">
</head>
<body>
<div class="wrap">
  <header class="site">
    <h1><a href="{{ url_for('reader.home') }}" style="text-decoration:none">{{ site_title }}</a></h1>
    <nav>
      <a href="{{ url_for('reader.home') }}">Recent</a>
      <a href="{{ url_for('reader.all_documents') }}">All</a>
      <a href="{{ url_for('reader.search') }}">Search</a>
      <form method="post" action="{{ url_for('reader.logout') }}" style="display:inline">
        <input type="hidden" name="csrf" value="{{ g.csrf_token }}">
        <button type="submit" style="background:none;border:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-decoration:underline">Log out</button>
      </form>
    </nav>
  </header>
  {% block content %}{% endblock %}
</div>
</body>
</html>
