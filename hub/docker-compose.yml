# kindle-os hub.
#
# Read the three comments below before changing anything: each one is a
# RHEL-family or shared-box hazard that gives no warning when you get it wrong.

services:
  kindle-hub:
    build: .
    image: kindle-hub:0.1.0
    container_name: kindle-hub
    restart: unless-stopped

    # HAZARD 1 -- Docker publishes past firewalld.
    # There is no /etc/docker/daemon.json on the box, so Docker runs with
    # iptables=true and installs its own DOCKER chain, while firewalld runs
    # the nftables backend. A plain "8090:8090" here is reachable from the
    # public internet even though `firewall-cmd --list-all` reports only
    # ssh/http/https and looks entirely reassuring. Bind explicitly, and
    # verify from OFF the box (`nc -zv <ip> 8090` must fail) -- firewalld's
    # own output will not tell you.
    ports:
      - "127.0.0.1:8090:8090"

    # HAZARD 2 -- cgroup v1 with the cgroupfs driver.
    # mem_limit works, but swap accounting is v1-style and the box has
    # 2303 MB of swap across two swapfiles. Without memswap_limit a runaway
    # build pages heavily and thrashes the single vCPU while every other
    # vhost waits.
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.75

    # HAZARD 3 -- no daemon.json means no global log rotation, and
    # /var/lib/docker is already 3.7 GB of a 26 GB budget. Cap per service.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    env_file:
      # Not in git. root:artifacthub 0640 on the box. See .env.example.
      - /etc/artifact-hub/secrets.env

    environment:
      HUB_INBOX_DIR: /data/inbox
      HUB_LIBRARY_DIR: /data/library
      HUB_STATE_DIR: /data/state

    volumes:
      # rsync writes here from outside the container; the app only reads.
      - /srv/kindle-os/inbox:/data/inbox:ro
      - /srv/kindle-os/library:/data/library:rw
      - /srv/kindle-os/state:/data/state:rw
      # The personal library. Read-only on purpose: this shelf lists and
      # serves files, it never writes them. Uploads arrive by rsync from
      # outside the container.
      #
      # This mount was once added directly on the server with sed and lost at
      # the next deploy, which overwrote the file from the repo. Anything the
      # running system needs belongs here, not in a shell on the box.
      - /srv/kindle-os/ebooks:/data/ebooks:ro
      # No :z / :Z labels: SELinux is Disabled on this box. If it is ever
      # returned to enforcing, the bind mounts need container_file_t and
      # three other things break at the same time -- `kindle-hub doctor`
      # checks getenforce for exactly this reason.

    security_opt:
      - no-new-privileges:true
    # The container runs as uid 10001 (see Dockerfile). Everything it writes
    # must therefore be either a tmpfs or a bind mount owned by 10001 --
    # `chown -R 10001:10001 /srv/kindle-os` on the host. Getting this wrong
    # shows up as "sqlite3.OperationalError: unable to open database file",
    # which reads like a path bug and is actually a permissions bug.
    read_only: true
    tmpfs:
      - /tmp:size=32m
      # gunicorn 26 writes a control-server socket under $HOME. With
      # read_only: true and no writable HOME it logs "Control server error:
      # Read-only file system: /home/kindlehub/.gunicorn" on every boot.
      # Non-fatal on its own, but it is noise that hides real errors.
      # uid/gid must be set explicitly: a tmpfs defaults to root-owned, and
      # the process is uid 10001, so without these the same failure reappears
      # as "Permission denied" instead of "Read-only file system".
      - /home/kindlehub:size=8m,uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
